---
layout: default
title: Tags
permalink: /tag/
---

<article class="page-container">
  <div class="tags-title">
    <h1>{{ site.data.lang[site.language].post_tags }}</h1>
  </div>
  <ul class="tags-list">
    {% for tag in site.tags %}
      <li><a href="{{ site.baseurl }}/tag/{{ tag | first | slugify }}/">{{ tag | first }}</a></li>
    {% endfor %}
  </ul>
</article>
